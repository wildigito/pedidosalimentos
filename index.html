<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pedidos 50 Empresas | Acesso</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f4f5;color:#18181b;font-family:Arial,sans-serif}
    main{width:min(720px,100%)}h1{margin:0;font-size:clamp(28px,5vw,42px)}p{color:#52525b;margin:10px 0 28px}
    nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
    a{display:block;padding:24px;border-radius:18px;background:#fff;border:1px solid #e4e4e7;color:#18181b;text-decoration:none;box-shadow:0 8px 24px #0000000c}
    a:hover{border-color:#16a34a;transform:translateY(-2px)}strong{display:block;font-size:20px;margin-bottom:8px}span{color:#52525b;font-size:14px}
  </style>
</head>
<body>
  <main>
    <h1>PEDIDOS 50 Empresas</h1>
    <p>Escolha a área que deseja acessar.</p>
    <nav>
      <a href="administrativo/"><strong>Área administrativa</strong><span>Administração e entregas</span></a>
      <a href="pedidos/"><strong>Sistema de pedidos</strong><span>Pedidos das empresas</span></a>
    </nav>
  </main>
</body>
</html>
