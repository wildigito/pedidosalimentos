<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#101114">
  <title>Redefinir senha | Pedidos 50</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#101114;color:#f4f4f5}
    *{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;background:#101114}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
    .card{width:min(100%,430px);padding:26px;border:1px solid #292a30;border-radius:18px;background:#191a1f;box-shadow:0 18px 60px #0005}
    .mark{display:grid;place-items:center;width:46px;height:46px;border-radius:15px;background:#dc2626;color:#fff;font-weight:900;font-size:21px;margin-bottom:18px}
    h1{margin:0;font-size:24px;letter-spacing:-.04em}p{color:#a1a1aa;font-size:13px;line-height:1.5}
    label{display:block;margin:15px 0 7px;color:#d4d4d8;font-size:12px;font-weight:700}
    input,button{width:100%;height:42px;padding:0 12px;border:1px solid #383940;border-radius:10px;font:inherit}
    input{background:#101114;color:#fafafa;outline:none}input:focus{border-color:#ef4444;box-shadow:0 0 0 3px #ef444422}
    button{margin-top:17px;background:#dc2626;border-color:#dc2626;color:#fff;font-size:12px;font-weight:750;cursor:pointer}
    button:hover{background:#b91c1c}button:disabled{opacity:.6;cursor:wait}
    .msg{min-height:20px;margin-top:12px;color:#fca5a5;font-size:12px;line-height:1.45}
    a{color:#fca5a5;font-size:12px}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="mark" aria-hidden="true">P</div>
      <h1>Escolha uma nova senha</h1>
      <p>Crie uma senha nova para sua conta administrativa ou de entregador.</p>
      <form id="resetForm" hidden>
        <label for="newPassword">Nova senha</label>
        <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required>
        <label for="confirmPassword">Confirme a nova senha</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
        <button id="saveButton" type="submit">Salvar nova senha</button>
      </form>
      <div class="msg" id="message" role="status" aria-live="polite">Validando o link...</div>
      <a id="backLink" href="index.html" hidden>Voltar ao painel</a>
    </section>
  </main>
  <script>
    (async function(){
      const config = window.PEDIDOS_SUPABASE_CONFIG;
      const form = document.getElementById("resetForm");
      const message = document.getElementById("message");
      const saveButton = document.getElementById("saveButton");
      const backLink = document.getElementById("backLink");
      function showMessage(text, success){
        message.textContent = text;
        message.style.color = success ? "#86efac" : "#fca5a5";
      }
      if(!window.supabase || !config || !config.url || !config.publishableKey){
        showMessage("A configuração do Supabase não foi carregada.",false);
        return;
      }
      const db = window.supabase.createClient(config.url,config.publishableKey);
      const hash = new URLSearchParams(window.location.hash.slice(1));
      if(hash.has("error") || hash.has("error_code")){
        showMessage("Esse link expirou ou não é válido. Peça um novo link de recuperação.",false);
        backLink.hidden = false;
        return;
      }
      const sessionResult = await db.auth.getSession();
      if(sessionResult.error || !sessionResult.data.session){
        showMessage("Não encontrei uma sessão de recuperação válida. Peça um novo link.",false);
        backLink.hidden = false;
        return;
      }
      message.textContent = "O link está válido. Digite e confirme sua nova senha (mínimo de 8 caracteres).";
      form.hidden = false;
      form.addEventListener("submit",async function(event){
        event.preventDefault();
        const password = document.getElementById("newPassword").value;
        const confirmation = document.getElementById("confirmPassword").value;
        if(password !== confirmation){
          showMessage("As senhas não são iguais. Confira os dois campos.",false);
          return;
        }
        saveButton.disabled = true;
        showMessage("Salvando a nova senha...",true);
        try {
          const result = await db.auth.updateUser({password:password});
          if(result.error) throw result.error;
          await db.auth.signOut();
          form.hidden = true;
          showMessage("Senha alterada. Volte ao painel e entre com seu e-mail e a nova senha.",true);
          backLink.hidden = false;
        } catch(error) {
          showMessage(error.message || "Não consegui alterar a senha. Peça um novo link e tente novamente.",false);
        } finally {
          saveButton.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
